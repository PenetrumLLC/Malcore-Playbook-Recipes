<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Malcore Playbook Recipes</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f9f9f9;
      padding: 2em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }
    th {
      background: #f2f2f2;
    }
    a {
      color: #007bff;
      text-decoration: none;
    }
    .mono {
      font-family: monospace;
      word-break: break-word;
    }
    #search-box {
      margin-bottom: 1em;
      padding: 0.5em;
      width: 100%;
      font-size: 1em;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<h1><img src="assets/images/recipe-book.png" height="35" width="35"> Malcore Playbook Recipes</h1>
<p>Available Recipes:</p>

<input type="text" id="search-box" placeholder="Search by filename or hash...">

<table>
  <thead>
    <tr>
      <th>Recipe Name</th>
      <th>Recipe MD5 Hash</th>
      <th>Recipe Version</th>
      <th>Recipe Author</th>
      <th>Download Recipe</th>
    </tr>
  </thead>
  <tbody id="file-list">
  </tbody>
</table>

<script>
  let files = [];

  fetch("assets/dbs/files.json")
    .then(res => res.json())
    .then(data => {
      files = data;
      renderFiles(files);
    });

  function renderFiles(fileList) {
    const tbody = document.getElementById("file-list");
    tbody.innerHTML = '';
    fileList.forEach(file => {
      const displayName = file.filename.replace(/\.py$/, '');
      const row = document.createElement("tr");
      row.innerHTML = `
        <td class="mono">${displayName}</td>
        <td class="mono">${file.hashsum}</td>
        <td class="mono">${file.version}</td>
        <td class="mono">${file.author}</td>
        <td><a href="recipes/${file.filename}" download>Download</a></td>
      `;
      tbody.appendChild(row);
    });
  }

  document.getElementById("search-box").addEventListener("input", function() {
    const query = this.value.toLowerCase();
    const filtered = files.filter(file =>
      file.filename.toLowerCase().includes(query) ||
      file.hashsum.toLowerCase().includes(query)
    );
    renderFiles(filtered);
  });
</script>

</body>
</html>
